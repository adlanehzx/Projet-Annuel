services:
  db:
    image: postgres:15-alpine
    container_name: cinetrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cinetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cinetrack-frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:3001/api
      - NUXT_API_BASE=http://backend:3001/api
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NUXT_PUBLIC_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - NUXT_PUBLIC_GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/callback/github}
      - NUXT_PUBLIC_ANALYTICS_PROVIDER=umami
      - NUXT_PUBLIC_ANALYTICS_SCRIPT_SRC=${NUXT_PUBLIC_ANALYTICS_SCRIPT_SRC:-http://localhost:3002/script.js}
      - NUXT_PUBLIC_ANALYTICS_WEBSITE_ID=${NUXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
      - NUXT_PUBLIC_ANALYTICS_DOMAIN=${NUXT_PUBLIC_ANALYTICS_DOMAIN:-localhost}
    depends_on:
      - backend
    networks:
      - cinetrack-network
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    container_name: cinetrack-umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - cinetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: cinetrack-umami
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-this-umami-secret}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - cinetrack-network
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: cinetrack-libretranslate
    ports:
      - "5050:5000"
    environment:
      - LT_LOAD_ONLY=en,fr
    networks:
      - cinetrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:5000/languages >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinetrack-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cinetrack
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here}
      - FRONTEND_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/callback/github}
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinetrack-network
    restart: unless-stopped

networks:
  cinetrack-network:
    driver: bridge

volumes:
  postgres_data:
  umami_db_data:
