services:
  db:
    image: postgres:15-alpine
    container_name: cinetrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cinetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cinetrack-frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:3001/api
      - NUXT_API_BASE=http://backend:3001/api
    depends_on:
      - backend
    networks:
      - cinetrack-network
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: cinetrack-libretranslate
    ports:
      - "5050:5000"
    environment:
      - LT_LOAD_ONLY=en,fr
    networks:
      - cinetrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/languages >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinetrack-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cinetrack
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here}
      - FRONTEND_URL=http://localhost:3000
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinetrack-network
    restart: unless-stopped

networks:
  cinetrack-network:
    driver: bridge

volumes:
  postgres_data:
